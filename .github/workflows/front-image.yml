name: Front — build e imagem

on:
  pull_request:
    paths: ["front/**", "packages/api-client/**", "pnpm-lock.yaml", ".github/workflows/front-image.yml"]
  push:
    branches: [main]
    paths: ["front/**", "packages/api-client/**", "pnpm-lock.yaml", ".github/workflows/front-image.yml"]
  workflow_dispatch:

concurrency:
  group: front-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # O Dockerfile roda `tsc` + `vite build`: em PRs serve de verificação (sem publicar).
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pilates-web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: front/Dockerfile
          # A VM do Oracle é ARM64 (o build do Node roda na plataforma nativa do runner).
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
