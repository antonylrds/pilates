# Dois ambientes de migração:
#   uv run alembic -n central upgrade head
#   uv run alembic -n tenant -x url=sqlite:///./data/tenants/meu_estudio.db upgrade head
# Para migrar todos os estúdios: uv run python -m app.cli migrate

[central]
script_location = %(here)s/migrations/central
prepend_sys_path = .
path_separator = os

[tenant]
script_location = %(here)s/migrations/tenant
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
