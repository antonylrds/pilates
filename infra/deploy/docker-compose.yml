services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pilates # superusuário: precisa de CREATEDB para criar o banco de cada estúdio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pilates_central
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilates -d pilates_central"]
      interval: 5s
      retries: 10

  # Etapa única de cada deploy: migra o banco central e o de cada estúdio (em paralelo) e garante o usuário da
  # plataforma. Se algum estúdio falhar, o serviço sai com erro e a API não sobe (a lista de falhas fica no log).
  migrate:
    image: ${API_IMAGE}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "python -m app.cli migrate --jobs 4 && python -m app.cli init"]
    environment:
      ENVIRONMENT: production
      # Papel das requisições: só SELECT/INSERT/UPDATE/DELETE (criado e liberado pelo serviço migrate).
      CENTRAL_DATABASE_URL: postgresql+psycopg://pilates_app:${APP_DB_PASSWORD}@db:5432/pilates_central
      TENANT_DATABASE_URL_TEMPLATE: postgresql+psycopg://pilates_app:${APP_DB_PASSWORD}@db:5432/pilates_{slug}
      # Admin (dono dos bancos): cria bancos de estúdio e roda migrações. Requisições usam o papel pilates_app.
      ADMIN_CENTRAL_DATABASE_URL: postgresql+psycopg://pilates:${POSTGRES_PASSWORD}@db:5432/pilates_central
      ADMIN_TENANT_DATABASE_URL_TEMPLATE: postgresql+psycopg://pilates:${POSTGRES_PASSWORD}@db:5432/pilates_{slug}
      SECRET_KEY: ${SECRET_KEY}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # Papel das requisições: só SELECT/INSERT/UPDATE/DELETE (criado e liberado pelo serviço migrate).
      CENTRAL_DATABASE_URL: postgresql+psycopg://pilates_app:${APP_DB_PASSWORD}@db:5432/pilates_central
      TENANT_DATABASE_URL_TEMPLATE: postgresql+psycopg://pilates_app:${APP_DB_PASSWORD}@db:5432/pilates_{slug}
      # Admin (dono dos bancos): cria bancos de estúdio e roda migrações. Requisições usam o papel pilates_app.
      ADMIN_CENTRAL_DATABASE_URL: postgresql+psycopg://pilates:${POSTGRES_PASSWORD}@db:5432/pilates_central
      ADMIN_TENANT_DATABASE_URL_TEMPLATE: postgresql+psycopg://pilates:${POSTGRES_PASSWORD}@db:5432/pilates_{slug}
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY}
      # Só o Caddy (mesma rede do compose) alcança a API: confia no X-Forwarded-For dele para o IP real do cliente.
      FORWARDED_ALLOW_IPS: "*"
      CORS_ORIGINS: ${CORS_ORIGINS}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /app/data/files
    volumes:
      - files:/app/data/files

  # Front estático + Caddy (HTTPS automático); repassa /api e /health para a API.
  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - caddy_data:/data

volumes:
  pgdata:
  files:
  caddy_data:
