services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pilates # superusuário: precisa de CREATEDB para criar o banco de cada estúdio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pilates_central
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilates -d pilates_central"]
      interval: 5s
      retries: 10

  api:
    image: ${API_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CENTRAL_DATABASE_URL: postgresql+psycopg://pilates:${POSTGRES_PASSWORD}@db:5432/pilates_central
      TENANT_DATABASE_URL_TEMPLATE: postgresql+psycopg://pilates:${POSTGRES_PASSWORD}@db:5432/pilates_{slug}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /app/data/files
    volumes:
      - files:/app/data/files

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  pgdata:
  files:
  caddy_data:
